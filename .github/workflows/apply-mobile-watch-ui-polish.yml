name: Apply mobile watch UI polish
on:
  push:
    branches:
      - agent/mobile-watch-ui-polish-v2
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Apply requested source changes
        run: python tools/apply_mobile_watch_ui_polish.py
      - name: Fix generated integration output
        run: python tools/post_fix_mobile_watch_ui_polish.py
      - name: Refresh regression expectations
        run: |
          sed -i 's/assertEquals(34, AllProviders.classes.distinct().size)/assertEquals(19, AllProviders.classes.distinct().size)/' complications/src/test/kotlin/app/aapswear/complications/TherapyComplicationsTest.kt
          sed -i 's/LongStatusComplication::class.java/GlucoseGraphComplication::class.java/' complications/src/test/kotlin/app/aapswear/complications/TherapyComplicationsTest.kt
      - name: Verify patch formatting
        run: git diff --check
      - name: Test and build affected modules
        run: ./gradlew :app-mobile:testDebugUnitTest :app-mobile:assembleDebug :app-wear:testDebugUnitTest :app-wear:assembleDebug :complications:testDebugUnitTest
      - name: Commit source-only integration
        run: |
          rm -f tools/apply_mobile_watch_ui_polish.py
          rm -f tools/post_fix_mobile_watch_ui_polish.py
          rm -f tools/fix_mobile_watch_apply_script.py
          rm -f .github/workflows/apply-mobile-watch-ui-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish mobile navigation, watch previews and notification graph"
          git push origin HEAD:agent/mobile-watch-ui-polish-v2
