name: Integrate current Sugarlicious changes

on:
  push:
    branches:
      - agent/integrate-all-current

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-all-current
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply all current chat changes
        run: python3 tools/integrate-current-chat.py

      - name: Fix stale complication provider test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('complications/src/test/kotlin/app/aapswear/complications/TherapyComplicationsTest.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('assertEquals(27, AllProviders.classes.distinct().size)', 'assertEquals(28, AllProviders.classes.distinct().size)')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify whitespace
        run: git diff --check

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Test and build affected modules
        run: ./gradlew :app-mobile:testDebugUnitTest :app-mobile:assembleDebug :app-wear:testDebugUnitTest :app-wear:assembleDebug :complications:testDebugUnitTest

      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate current UI, graph, theme and watch fixes"
            git push origin HEAD:agent/integrate-all-current
          fi
