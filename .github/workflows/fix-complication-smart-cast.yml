name: Fix complication title compile error

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace smart-cast block
        shell: bash
        run: |
          python3 tools/fix_complication_title.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complications/src/main/kotlin/app/aapswear/complications/TherapyComplications.kt
          git commit -m "Fix complication title smart cast"
          git push origin HEAD:agent/complication-watch-refactor-v6
