name: apply-prediction-dot-settings

on:
  push:
    branches:
      - agent/cgm-settings-target-light-outline

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-settings-target-light-outline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply prediction dot settings
        run: python .github/scripts/apply_prediction_dot_settings.py

      - name: Verify patch diff
        run: |
          git diff --check
          git diff --stat

      - name: Test and build mobile app
        run: bash ./gradlew :app-mobile:test :app-mobile:assembleDebug

      - name: Commit tested changes
        run: |
          rm .github/workflows/apply-prediction-dot-settings.yml
          rm .github/scripts/apply_prediction_dot_settings.py
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardViews.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/MainActivity.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/SugarliciousOverviewScreen.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardCharts.kt \
            .github/workflows/apply-prediction-dot-settings.yml \
            .github/scripts/apply_prediction_dot_settings.py
          git commit -m "Add configurable prediction dot styling"
          git push origin HEAD:agent/cgm-settings-target-light-outline
