name: Apply complication watch refactor

on:
  push:
    branches:
      - agent/complication-watch-refactor-v3

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble and apply exact source pass
        run: |
          cat tools/refactor_payload/part_* > tools/apply_refactor_v3.py
          python tools/apply_refactor_v3.py

      - name: Verify source formatting
        run: git diff --check

      - name: Test and build affected modules
        run: >-
          ./gradlew
          :core-model:test
          :complications:testDebugUnitTest
          :app-mobile:testDebugUnitTest
          :app-mobile:assembleDebug
          :app-wear:testDebugUnitTest
          :app-wear:assembleDebug

      - name: Commit source-only integration
        run: |
          rm -rf tools/refactor_payload
          rm -f tools/apply_refactor_v3.py
          rm -f .github/workflows/apply-complication-watch-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor complications, watch UI and shared graph presentation"
          git push origin HEAD:agent/complication-watch-refactor-v3
