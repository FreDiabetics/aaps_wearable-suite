name: Apply complication watch refactor

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Reassemble and apply exact source pass
        run: |
          cat tools/refactor_payload/part_* > tools/apply_refactor_v3.py
          python tools/apply_refactor_v3.py
          test -f core-model/src/main/kotlin/app/aapswear/model/ComplicationPresentation.kt
          test -f app-wear/src/main/kotlin/app/aapswear/wear/WearSettingsActivity.kt
          git status --short
          git diff --stat

      - name: Stage and guard source integration
        run: |
          git add -f app-mobile app-wear complications core-model wear-protocol design-assets
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --name-only | tee /tmp/staged-files.txt
          grep -Fxq 'core-model/src/main/kotlin/app/aapswear/model/ComplicationPresentation.kt' /tmp/staged-files.txt
          grep -Fxq 'app-wear/src/main/kotlin/app/aapswear/wear/WearSettingsActivity.kt' /tmp/staged-files.txt
          grep -Fxq 'complications/src/main/kotlin/app/aapswear/complications/ActiveComplicationRegistry.kt' /tmp/staged-files.txt

      - name: Test and build affected modules
        run: >-
          ./gradlew
          :core-model:test
          :complications:testDebugUnitTest
          :app-mobile:testDebugUnitTest
          :app-mobile:assembleDebug
          :app-wear:testDebugUnitTest
          :app-wear:assembleDebug

      - name: Commit verified source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refactor complications, watch UI and shared graph presentation"
          git push origin HEAD:agent/complication-watch-refactor-v6

      - name: Remove temporary integration assets
        run: |
          rm -rf tools/refactor_payload
          rm -f tools/apply_refactor_v3.py
          rm -f .github/workflows/apply-complication-watch-refactor.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary refactor integration assets"
          git push origin HEAD:agent/complication-watch-refactor-v6
