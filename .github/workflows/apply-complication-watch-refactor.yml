name: Diagnose complication watch refactor payload

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recovered payload around JSON corruption
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, zlib

          parts = sorted(Path('tools/refactor_payload').glob('part_*'))
          first = parts[0].read_text()
          encoded = first.split("DATA='", 1)[1] + ''.join(p.read_text() for p in parts[1:])
          encoded = ''.join(encoded.split())
          packed = base64.b64decode(encoded, validate=True)
          try:
              raw = gzip.decompress(packed)
          except Exception as exc:
              print('gzip:', repr(exc))
              raw = zlib.decompress(packed[10:], -zlib.MAX_WBITS)

          text = raw.decode('utf-8')
          print('decoded_length:', len(text))
          try:
              obj = json.loads(text)
              print('JSON_OK files=', len(obj))
              raise SystemExit(0)
          except json.JSONDecodeError as exc:
              pos = exc.pos
              print('json_error:', exc.msg, 'pos=', pos, 'line=', exc.lineno, 'col=', exc.colno)
              print('context_start')
              print(repr(text[max(0,pos-1200):min(len(text),pos+1200)]))
              print('context_end')

          # Parse the top-level path->content object incrementally so the exact
          # source entry containing the corruption is identified without guessing.
          dec = json.JSONDecoder()
          i = 0
          n = len(text)
          def ws(j):
              while j < n and text[j].isspace():
                  j += 1
              return j

          i = ws(i)
          if i >= n or text[i] != '{':
              raise SystemExit('top-level payload is not an object')
          i += 1
          count = 0
          last_key = None
          while True:
              i = ws(i)
              if i < n and text[i] == '}':
                  print('incremental_parse_complete entries=', count)
                  break
              try:
                  key, end = dec.raw_decode(text, i)
              except json.JSONDecodeError as exc:
                  print('key_parse_failed after=', last_key, 'at=', i, 'error=', repr(exc))
                  break
              if not isinstance(key, str):
                  print('non_string_key at=', i, 'value=', repr(key))
                  break
              i = ws(end)
              if i >= n or text[i] != ':':
                  print('colon_missing_for_key=', key, 'at=', i, 'near=', repr(text[max(0,i-250):min(n,i+250)]))
                  break
              i = ws(i + 1)
              try:
                  value, end = dec.raw_decode(text, i)
              except json.JSONDecodeError as exc:
                  print('value_parse_failed_for_key=', key)
                  print('value_start=', i, 'error_pos=', exc.pos, 'error=', repr(exc))
                  print('value_context=', repr(text[max(i,exc.pos-1000):min(n,exc.pos+1000)]))
                  break
              if not isinstance(value, str):
                  print('non_string_value_for_key=', key, 'type=', type(value).__name__)
                  break
              count += 1
              last_key = key
              if count <= 5 or count % 5 == 0:
                  print('parsed_entry', count, key, 'chars=', len(value))
              i = ws(end)
              if i < n and text[i] == ',':
                  i += 1
                  continue
              if i < n and text[i] == '}':
                  print('incremental_parse_complete entries=', count)
                  break
              print('separator_missing_after_key=', key, 'at=', i, 'near=', repr(text[max(0,i-250):min(n,i+250)]))
              break
          PY
