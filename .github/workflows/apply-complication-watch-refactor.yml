name: Diagnose complication watch refactor payload

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify corrupted payload entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, re, zlib

          parts = sorted(Path('tools/refactor_payload').glob('part_*'))
          first = parts[0].read_text()
          encoded = first.split("DATA='", 1)[1] + ''.join(p.read_text() for p in parts[1:])
          packed = base64.b64decode(''.join(encoded.split()), validate=True)
          text = zlib.decompress(packed[10:], -zlib.MAX_WBITS).decode('utf-8')
          print('decoded_length=', len(text))

          # Incrementally parse all entries that are intact before the corruption.
          dec = json.JSONDecoder()
          i = 1
          n = len(text)
          parsed = []
          def ws(j):
              while j < n and text[j].isspace(): j += 1
              return j
          while True:
              i = ws(i)
              try:
                  key, end = dec.raw_decode(text, i)
              except Exception as exc:
                  print('KEY_PARSE_FAIL after=', parsed[-1] if parsed else None, 'at=', i, repr(exc))
                  break
              i = ws(end)
              if i >= n or text[i] != ':':
                  print('COLON_FAIL after=', parsed[-1] if parsed else None)
                  print('MALFORMED_KEY=', repr(key))
                  print('AT=', i)
                  break
              i = ws(i + 1)
              try:
                  value, end = dec.raw_decode(text, i)
              except Exception as exc:
                  print('VALUE_PARSE_FAIL key=', key, 'at=', i, repr(exc))
                  break
              parsed.append(key)
              print(f'OK[{len(parsed):02d}] {key} chars={len(value)} end={end}')
              i = ws(end)
              if i < n and text[i] == ',':
                  i += 1
                  continue
              print('SEPARATOR_FAIL key=', key, 'at=', i)
              break

          # Find every syntactically recognizable path key anywhere in the recovered text.
          path_re = re.compile(r'"((?:core-model|wear-protocol|complications|app-mobile|app-wear)/[^"\\]+)"\s*:')
          hits = [(m.start(), m.group(1)) for m in path_re.finditer(text)]
          print('RECOGNIZABLE_PATH_KEYS=', len(hits))
          for pos, path in hits:
              if pos > 245000 or path not in parsed:
                  print('PATH', pos, path)

          err = 264736
          before = [x for x in hits if x[0] < err]
          after = [x for x in hits if x[0] > err]
          print('NEAREST_BEFORE=', before[-5:])
          print('NEAREST_AFTER=', after[:8])
          print('CORRUPT_REGION=', repr(text[260000:269000]))
          PY
