name: Apply complication watch refactor

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Decode and apply exact source pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, zlib

          parts = sorted(Path('tools/refactor_payload').glob('part_*'))
          if len(parts) != 11:
              raise SystemExit(f'expected 11 refactor payload parts, got {len(parts)}')

          first = parts[0].read_text()
          marker = "DATA='"
          if marker not in first:
              raise SystemExit('DATA marker missing from first payload part')

          encoded = first.split(marker, 1)[1]
          encoded += ''.join(part.read_text() for part in parts[1:])
          encoded = ''.join(encoded.split())

          try:
              packed = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'base64 decode failed: {exc}') from exc

          try:
              decoded_bytes = gzip.decompress(packed)
              print('gzip wrapper CRC valid')
          except Exception as gzip_exc:
              print(f'gzip wrapper validation failed ({gzip_exc}); trying raw deflate stream')
              try:
                  decoded_bytes = zlib.decompress(packed[10:], -zlib.MAX_WBITS)
              except Exception as raw_exc:
                  raise SystemExit(f'raw deflate recovery failed: {raw_exc}') from raw_exc

          try:
              decoded = decoded_bytes.decode('utf-8')
              payload = json.loads(decoded)
          except Exception as exc:
              raise SystemExit(f'decoded payload JSON invalid: {exc}') from exc

          if not isinstance(payload, dict):
              raise SystemExit(f'payload must be a dict, got {type(payload).__name__}')
          if len(payload) != 45:
              raise SystemExit(f'expected 45 source files, got {len(payload)}')

          for path, content in payload.items():
              if not isinstance(path, str) or not isinstance(content, str):
                  raise SystemExit(f'invalid payload entry for {path!r}')
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          Path('tools/refactor_payload_paths.txt').write_text('\n'.join(sorted(payload)) + '\n')
          print(f'decoded and wrote {len(payload)} source files')
          PY
          test -f core-model/src/main/kotlin/app/aapswear/model/ComplicationPresentation.kt
          test -f app-wear/src/main/kotlin/app/aapswear/wear/WearSettingsActivity.kt
          test -f complications/src/main/kotlin/app/aapswear/complications/ActiveComplicationRegistry.kt
      - name: Stage exact source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = [line for line in Path('tools/refactor_payload_paths.txt').read_text().splitlines() if line]
          if len(expected) != 45:
              raise SystemExit(f'expected 45 paths in manifest, got {len(expected)}')

          for path in expected:
              if not Path(path).exists():
                  raise SystemExit(f'generated source file missing: {path}')
              subprocess.run(['git', 'add', '-f', '--', path], check=True)

          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if sorted(staged) != sorted(expected):
              missing = sorted(set(expected) - set(staged))
              extra = sorted(set(staged) - set(expected))
              raise SystemExit(f'staging mismatch; missing={missing}; extra={extra}')
          print('\n'.join(staged))
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Test and build affected modules
        run: >-
          ./gradlew
          :core-model:test
          :complications:testDebugUnitTest
          :app-mobile:testDebugUnitTest
          :app-mobile:assembleDebug
          :app-wear:testDebugUnitTest
          :app-wear:assembleDebug
      - name: Commit verified source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refactor complications, watch UI and shared graph presentation"
          git push origin HEAD:agent/complication-watch-refactor-v6
      - name: Remove temporary integration assets
        run: |
          rm -rf tools/refactor_payload
          rm -f tools/refactor_payload_paths.txt
          rm -f tools/apply_refactor_v3.py
          rm -f .github/workflows/apply-complication-watch-refactor.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary refactor integration assets"
          git push origin HEAD:agent/complication-watch-refactor-v6
