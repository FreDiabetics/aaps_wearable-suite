name: Recover verified refactor sources

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover 23 verified source entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, zlib

          parts = sorted(Path('tools/refactor_payload').glob('part_*'))
          first = parts[0].read_text()
          encoded = first.split("DATA='", 1)[1] + ''.join(p.read_text() for p in parts[1:])
          packed = base64.b64decode(''.join(encoded.split()), validate=True)
          text = zlib.decompress(packed[10:], -zlib.MAX_WBITS).decode('utf-8')

          expected_last = 'app-mobile/src/main/res/drawable-anydpi/ic_notification_outlined.xml'
          dec = json.JSONDecoder()
          i = 1
          n = len(text)
          recovered = {}
          def ws(j):
              while j < n and text[j].isspace(): j += 1
              return j

          while len(recovered) < 23:
              i = ws(i)
              key, end = dec.raw_decode(text, i)
              if not isinstance(key, str):
                  raise SystemExit(f'non-string key at entry {len(recovered)+1}')
              i = ws(end)
              if i >= n or text[i] != ':':
                  raise SystemExit(f'missing colon for {key}')
              i = ws(i + 1)
              value, end = dec.raw_decode(text, i)
              if not isinstance(value, str):
                  raise SystemExit(f'non-string content for {key}')
              recovered[key] = value
              i = ws(end)
              if len(recovered) < 23:
                  if i >= n or text[i] != ',':
                      raise SystemExit(f'missing separator after {key}')
                  i += 1

          keys = list(recovered)
          if len(keys) != 23 or keys[-1] != expected_last:
              raise SystemExit(f'unexpected verified prefix: count={len(keys)} last={keys[-1] if keys else None}')

          for path, content in recovered.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          Path('tools/verified_refactor_paths.txt').write_text('\n'.join(keys) + '\n')
          print('\n'.join(keys))
          PY
      - name: Stage verified sources and remove broken transport
        run: |
          while IFS= read -r path; do
            git add -f -- "$path"
          done < tools/verified_refactor_paths.txt
          rm -rf tools/refactor_payload
          rm -f tools/apply_refactor_v3.py tools/verified_refactor_paths.txt
          rm -f .github/workflows/apply-complication-watch-refactor.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat
      - name: Commit recovered source base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover verified complication and mobile refactor sources"
          git push origin HEAD:agent/complication-watch-refactor-v6
