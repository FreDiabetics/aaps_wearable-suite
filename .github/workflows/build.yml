name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and build all applications and watchfaces
        run: ./gradlew test assembleDebug
      - name: Validate Watch Face Format XML
        run: |
          python tools/validate_watchface_xml.py watchfaces/wff-digital/src/main/res/raw/watchface.xml
          python tools/validate_watchface_xml.py watchfaces/wff-analog/src/main/res/raw/watchface.xml
          python tools/validate_watchface_xml.py watchfaces/wff-orbit/src/main/res/raw/watchface.xml
          python tools/validate_watchface_xml.py watchfaces/wff-rings/src/main/res/raw/watchface.xml
          python tools/validate_watchface_xml.py watchfaces/wff-graph/src/main/res/raw/watchface.xml
      - name: Build release Watch Face Push APKs
        run: |
          ./gradlew \
            :watchfaces:wff-analog:assembleRelease \
            :watchfaces:wff-orbit:assembleRelease \
            :watchfaces:wff-rings:assembleRelease \
            :watchfaces:wff-graph:assembleRelease
      - name: Verify code-free watchface APKs
        run: |
          python tools/verify_wff_apk.py watchfaces/wff-analog/build/outputs/apk/release/wff-analog-release.apk
          python tools/verify_wff_apk.py watchfaces/wff-orbit/build/outputs/apk/release/wff-orbit-release.apk
          python tools/verify_wff_apk.py watchfaces/wff-rings/build/outputs/apk/release/wff-rings-release.apk
          python tools/verify_wff_apk.py watchfaces/wff-graph/build/outputs/apk/release/wff-graph-release.apk
