name: Apply notification graph options

on:
  push:
    branches:
      - agent/notification-graph-options

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/notification-graph-options
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply notification graph changes
        run: python3 tools/apply-notification-graph-options.py

      - name: Verify diff
        run: git diff --check

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Test and build mobile
        run: ./gradlew :app-mobile:testDebugUnitTest :app-mobile:assembleDebug

      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-mobile
          git commit -m "Add notification graph visibility and time scale options"
          git push origin HEAD:agent/notification-graph-options
