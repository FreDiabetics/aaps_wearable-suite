name: retry-cgm-settings-ui-fix

on:
  push:
    branches:
      - agent/cgm-settings-target-light-outline

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-settings-target-light-outline
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply existing patch script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/apply-cgm-settings-ui-fix.yml").read_text(encoding="utf-8")
          marker_start = "      - name: Apply settings and graph fixes\n        shell: python\n        run: |\n"
          marker_end = "\n      - name: Verify patch diff"
          if marker_start not in workflow or marker_end not in workflow:
              raise RuntimeError("Could not locate patch script in source workflow")
          block = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(script, "apply-cgm-settings-ui-fix", "exec"), {})

          paths = [
              Path("app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardViews.kt"),
              Path("app-mobile/src/main/kotlin/app/aapswear/mobile/SugarliciousColorSettingsPanel.kt"),
              Path("app-mobile/src/main/kotlin/app/aapswear/mobile/ui/theme/SugarliciousColors.kt"),
              Path("app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardCharts.kt"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              cleaned = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              path.write_text(cleaned, encoding="utf-8")

      - name: Verify patch diff
        run: |
          git diff --check
          git diff --stat

      - name: Test and build mobile app
        run: ./gradlew :app-mobile:test :app-mobile:assembleDebug

      - name: Commit tested fix
        run: |
          rm .github/workflows/apply-cgm-settings-ui-fix.yml
          rm .github/workflows/retry-cgm-settings-ui-fix.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardViews.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/SugarliciousColorSettingsPanel.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/ui/theme/SugarliciousColors.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardCharts.kt \
            .github/workflows/apply-cgm-settings-ui-fix.yml \
            .github/workflows/retry-cgm-settings-ui-fix.yml
          git commit -m "Fix CGM settings expansion and light-mode readability"
          git push origin HEAD:agent/cgm-settings-target-light-outline
