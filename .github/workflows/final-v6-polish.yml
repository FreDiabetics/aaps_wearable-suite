name: Final v6 polish

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Apply final audited polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing {label} in {path}')
              p.write_text(text.replace(old, new, 1))

          # Persist expanded settings sections across complete Settings rebuilds/activity recreation.
          path = Path('app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardViews.kt')
          text = path.read_text()
          old = '''    private var colorSettingsExpanded = false
    private var predictionSettingsExpanded = false
    private var notificationGraphSettingsExpanded = false
'''
          new = '''    private val settingsUiPreferences =
        context.getSharedPreferences("dashboard_settings_ui", Context.MODE_PRIVATE)
    private var colorSettingsExpanded =
        settingsUiPreferences.getBoolean("colors_expanded", false)
    private var predictionSettingsExpanded =
        settingsUiPreferences.getBoolean("predictions_expanded", false)
    private var notificationGraphSettingsExpanded =
        settingsUiPreferences.getBoolean("notification_graph_expanded", false)
'''
          if old not in text:
              raise SystemExit('DashboardViewFactory state fields not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''                        colorSettingsExpanded = !colorSettingsExpanded
                        colorContainer.visibility = if (colorSettingsExpanded) View.VISIBLE else View.GONE
''',
              '''                        colorSettingsExpanded = !colorSettingsExpanded
                        settingsUiPreferences.edit().putBoolean("colors_expanded", colorSettingsExpanded).apply()
                        colorContainer.visibility = if (colorSettingsExpanded) View.VISIBLE else View.GONE
''',
              1,
          )
          text = text.replace(
              '''                            predictionSettingsExpanded = !predictionSettingsExpanded
                            predictionContainer.visibility = if (predictionSettingsExpanded) View.VISIBLE else View.GONE
''',
              '''                            predictionSettingsExpanded = !predictionSettingsExpanded
                            settingsUiPreferences.edit().putBoolean("predictions_expanded", predictionSettingsExpanded).apply()
                            predictionContainer.visibility = if (predictionSettingsExpanded) View.VISIBLE else View.GONE
''',
              1,
          )
          text = text.replace(
              '''                            notificationGraphSettingsExpanded = !notificationGraphSettingsExpanded
                            notificationGraphCustomization.visibility = if (notificationGraphSettingsExpanded) View.VISIBLE else View.GONE
''',
              '''                            notificationGraphSettingsExpanded = !notificationGraphSettingsExpanded
                            settingsUiPreferences.edit().putBoolean("notification_graph_expanded", notificationGraphSettingsExpanded).apply()
                            notificationGraphCustomization.visibility = if (notificationGraphSettingsExpanded) View.VISIBLE else View.GONE
''',
              1,
          )
          path.write_text(text)

          # Wear overview: remove old header, simplify glucose tile, make graph itself the tile,
          # add a dedicated settings action before the minimal footer.
          path = Path('app-wear/src/main/res/layout/activity_wear.xml')
          text = path.read_text()
          header_pattern = re.compile(r'''\n\s*<LinearLayout\n\s*android:layout_width="match_parent"\n\s*android:layout_height="40dp"[\s\S]*?</LinearLayout>\n\n\s*(?=<LinearLayout\n\s*android:id="@\+id/wear_glucose_card")''')
          text, n = header_pattern.subn('\n\n            ', text, count=1)
          if n != 1:
              raise SystemExit('wear header block not removed')

          glucose_block = '''<LinearLayout
                android:id="@+id/wear_glucose_card"
                android:layout_width="match_parent"
                android:layout_height="82dp"
                android:orientation="vertical"
                android:paddingStart="12dp"
                android:paddingTop="5dp"
                android:paddingEnd="12dp"
                android:paddingBottom="6dp">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="0dp"
                    android:layout_weight="1"
                    android:gravity="center"
                    android:orientation="horizontal">

                    <TextView
                        android:id="@+id/wear_glucose"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:includeFontPadding="false"
                        android:text="—"
                        android:textColor="@color/wear_text"
                        android:textSize="40sp"
                        android:textStyle="bold" />

                    <LinearLayout
                        android:id="@+id/wear_trend_container"
                        android:layout_width="wrap_content"
                        android:layout_height="36dp"
                        android:layout_marginStart="5dp"
                        android:gravity="center"
                        android:orientation="horizontal">

                        <ImageView
                            android:id="@+id/wear_trend_arrow_1"
                            android:layout_width="27dp"
                            android:layout_height="27dp"
                            android:contentDescription="Trend"
                            android:src="@drawable/ic_trend_arrow"
                            android:tint="@color/wear_text" />

                        <ImageView
                            android:id="@+id/wear_trend_arrow_2"
                            android:layout_width="27dp"
                            android:layout_height="27dp"
                            android:layout_marginStart="1dp"
                            android:contentDescription="Trend"
                            android:src="@drawable/ic_trend_arrow"
                            android:tint="@color/wear_text"
                            android:visibility="gone" />
                    </LinearLayout>
                </LinearLayout>

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:gravity="center"
                    android:orientation="horizontal">

                    <TextView
                        android:id="@+id/wear_delta"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="—"
                        android:textColor="@color/wear_cyan"
                        android:textSize="10sp"
                        android:textStyle="bold" />

                    <TextView
                        android:id="@+id/wear_age"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:layout_marginStart="7dp"
                        android:text="—"
                        android:textColor="@color/wear_text_secondary"
                        android:textSize="9sp" />
                </LinearLayout>
            </LinearLayout>

            <LinearLayout
                android:id="@+id/wear_basal_card"'''
          pattern = re.compile(r'''<LinearLayout\n\s*android:id="@\+id/wear_glucose_card"[\s\S]*?<LinearLayout\n\s*android:id="@\+id/wear_basal_card"''')
          text, n = pattern.subn(glucose_block, text, count=1)
          if n != 1:
              raise SystemExit('glucose block not replaced')

          graph_block = '''<FrameLayout
                android:id="@+id/wear_graph_card"
                android:layout_width="match_parent"
                android:layout_height="126dp"
                android:layout_marginTop="6dp">

                <app.aapswear.wear.WearGlucoseChart
                    android:id="@+id/wear_glucose_chart"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent" />
            </FrameLayout>

            <LinearLayout
                android:id="@+id/wear_connection_card"'''
          pattern = re.compile(r'''<LinearLayout\n\s*android:id="@\+id/wear_graph_card"[\s\S]*?<LinearLayout\n\s*android:id="@\+id/wear_connection_card"''')
          text, n = pattern.subn(graph_block, text, count=1)
          if n != 1:
              raise SystemExit('graph block not replaced')

          footer_marker = '''            <LinearLayout
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="9dp"
                android:gravity="center"
                android:orientation="horizontal">

                <ImageView
                    android:id="@+id/wear_footer_icon"'''
          settings_and_footer = '''            <LinearLayout
                android:id="@+id/wear_settings_action"
                android:layout_width="match_parent"
                android:layout_height="42dp"
                android:layout_marginTop="6dp"
                android:clickable="true"
                android:focusable="true"
                android:gravity="center"
                android:orientation="horizontal">

                <ImageView
                    android:layout_width="18dp"
                    android:layout_height="18dp"
                    android:contentDescription="Einstellungen"
                    android:src="@drawable/ic_settings"
                    android:tint="@color/wear_text" />

                <TextView
                    android:id="@+id/wear_settings_label"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginStart="6dp"
                    android:text="Einstellungen"
                    android:textColor="@color/wear_text"
                    android:textSize="9sp"
                    android:textStyle="bold" />
            </LinearLayout>

            <LinearLayout
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="9dp"
                android:gravity="center"
                android:orientation="horizontal">

                <ImageView
                    android:id="@+id/wear_footer_icon"'''
          if footer_marker not in text:
              raise SystemExit('footer marker not found')
          text = text.replace(footer_marker, settings_and_footer, 1)
          text = text.replace('android:src="@drawable/ic_sugarlicious_monochrome"\n                    android:tint="@color/wear_text_secondary" />\n\n                <TextView\n                    android:id="@+id/wear_footer_text"', 'android:src="@drawable/ic_monochrome_outlined"\n                    android:tint="@color/wear_green" />\n\n                <TextView\n                    android:id="@+id/wear_footer_text"', 1)
          path.write_text(text)

          # Wear controller code follows the simplified XML. Keep periodic render job for age/data freshness.
          path = Path('app-wear/src/main/kotlin/app/aapswear/wear/WearActivity.kt')
          text = path.read_text()
          for old in [
              'import java.text.SimpleDateFormat\n',
              'import java.util.Date\n',
              '    private lateinit var clock: TextView\n',
              '    private lateinit var unit: TextView\n',
              '    private lateinit var status: TextView\n',
              '    private lateinit var historyInfo: TextView\n',
              '        clock = findViewById(R.id.wear_clock)\n',
              '        unit = findViewById(R.id.wear_unit)\n',
              '        status = findViewById(R.id.wear_status)\n',
              '        historyInfo = findViewById(R.id.wear_history_info)\n',
          ]:
              text = text.replace(old, '')
          text = text.replace('findViewById<View>(R.id.wear_settings)', 'findViewById<View>(R.id.wear_settings_action)', 1)
          text = text.replace('        if (!::clock.isInitialized) return\n', '        if (!::glucose.isInitialized) return\n', 1)
          text = re.sub(r'''\n\s*clock\.text =\n\s*SimpleDateFormat\([\s\S]*?\)\.format\(Date\(now\)\)\n''', '\n', text, count=1)
          text = re.sub(r'''\n\s*unit\.text =\n\s*when \{[\s\S]*?\n\s*\}\n\n\s*renderTrend''', '\n\n        renderTrend', text, count=1)
          text = re.sub(r'''\n\s*status\.text =\n\s*when \(freshness\) \{[\s\S]*?\n\s*\}\n\n\s*status\.setTextColor\([\s\S]*?\n\s*\),\n\s*\)\n''', '\n', text, count=1)
          text = re.sub(r'''\n\s*historyInfo\.text =\n\s*if \(history\.isEmpty\(\)\) \{[\s\S]*?\n\s*\}\n\n\s*chart\.bind''', '\n\n        chart.bind', text, count=1)
          text = text.replace('                R.id.wear_brand_text,\n', '')
          text = text.replace('                R.id.wear_unit,\n', '')
          text = text.replace('                R.id.wear_clock,\n', '')
          text = text.replace('                R.id.wear_history_info,\n', '')
          text = text.replace('                R.id.wear_settings_label,\n', '')
          text = text.replace('        findViewById<ImageView>(R.id.wear_brand_icon).imageTintList = primaryTint\n', '')
          text = text.replace('findViewById<ImageView>(R.id.wear_settings).imageTintList', 'findViewById<ImageView>(R.id.wear_settings_action).imageTintList')
          # The settings action is a LinearLayout, so tint its child by id-independent drawable defaults;
          # color the label and give the whole action the normal tile background.
          text = text.replace('                R.id.wear_connection_card,\n', '                R.id.wear_connection_card,\n                R.id.wear_settings_action,\n', 1)
          text = text.replace('                R.id.wear_source,\n', '                R.id.wear_source,\n                R.id.wear_settings_label,\n', 1)
          text = text.replace('        findViewById<ImageView>(R.id.wear_settings_action).imageTintList = primaryTint\n', '')
          text = text.replace('            ColorStateList.valueOf(ui.textSecondary)\n', '            ColorStateList.valueOf(ui.accent)\n', 1)
          path.write_text(text)

          # Graph draws its own frame, grid and target labels so there is no nested graph tile.
          path = Path('app-wear/src/main/kotlin/app/aapswear/wear/WearGlucoseChart.kt')
          text = path.read_text()
          if 'import android.graphics.Typeface' not in text:
              text = text.replace('import android.graphics.Paint\n', 'import android.graphics.Paint\nimport android.graphics.Typeface\n')
          old = '''    private val emptyTextPaint =
        Paint(Paint.ANTI_ALIAS_FLAG).apply {
            color = context.getColor(R.color.wear_text_secondary)
            textSize =
                TypedValue.applyDimension(
                    TypedValue.COMPLEX_UNIT_SP,
                    10f,
                    resources.displayMetrics,
                )
            textAlign = Paint.Align.CENTER
        }
'''
          new = old + '''    private val labelPaint =
        Paint(Paint.ANTI_ALIAS_FLAG).apply {
            textSize =
                TypedValue.applyDimension(
                    TypedValue.COMPLEX_UNIT_SP,
                    10f,
                    resources.displayMetrics,
                )
            textAlign = Paint.Align.RIGHT
            typeface = Typeface.DEFAULT_BOLD
        }
'''
          if old not in text:
              raise SystemExit('WearGlucoseChart paint anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('        emptyTextPaint.color = colors.divider\n', '        emptyTextPaint.color = colors.divider\n        labelPaint.color = colors.divider\n', 1)
          anchor = '''        if (right <= left || bottom <= top) return

        if (history.isEmpty()) {
'''
          replacement = '''        if (right <= left || bottom <= top) return

        linePaint.color = colors.divider
        linePaint.strokeWidth = 0.8f.dp
        linePaint.pathEffect = null
        canvas.drawRoundRect(left, top, right, bottom, 10f.dp, 10f.dp, linePaint)

        if (history.isEmpty()) {
'''
          if anchor not in text:
              raise SystemExit('WearGlucoseChart frame anchor missing')
          text = text.replace(anchor, replacement, 1)
          anchor = '''        fillPaint.color = colors.rangeInRange
        canvas.drawRoundRect(
            left,
            targetTop,
            right,
            targetBottom,
            6f.dp,
            6f.dp,
            fillPaint,
        )

        linePaint.color = colors.divider
'''
          replacement = '''        fillPaint.color = colors.rangeInRange
        canvas.drawRoundRect(
            left,
            targetTop,
            right,
            targetBottom,
            6f.dp,
            6f.dp,
            fillPaint,
        )

        linePaint.color = colors.divider
        linePaint.strokeWidth = 0.55f.dp
        linePaint.pathEffect = DashPathEffect(floatArrayOf(3f.dp, 3f.dp), 0f)
        for (index in 1..3) {
            val gridY = top + (bottom - top) * index / 4f
            canvas.drawLine(left, gridY, right, gridY, linePaint)
        }
        linePaint.pathEffect = null
        canvas.drawText(targetHigh.toInt().toString(), right - 1f.dp, targetTop - 2f.dp, labelPaint)
        canvas.drawText(targetLow.toInt().toString(), right - 1f.dp, targetBottom - 2f.dp, labelPaint)

        linePaint.color = colors.divider
'''
          if anchor not in text:
              raise SystemExit('WearGlucoseChart target anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          outer_path = 'M12,1.05c0.55,0 1.1,0.14 1.59,0.43l7.57,4.37c0.98,0.57 1.59,1.62 1.59,2.76v6.78c0,1.14 -0.61,2.19 -1.59,2.76l-7.57,4.37c-0.98,0.57 -2.2,0.57 -3.18,0l-7.57,-4.37c-0.98,-0.57 -1.59,-1.62 -1.59,-2.76V8.61c0,-1.14 0.61,-2.19 1.59,-2.76l7.57,-4.37c0.49,-0.29 1.04,-0.43 1.59,-0.43z'
          glyph_path = 'M11.94,4.28l-3.24,5.64s-0.01,0.1 0.03,0.13l3.24,2.17s0.07,0.02 0.11,0l3.24,-2.17s0.05,-0.08 0.03,-0.13l-3.24,-5.64c-0.04,-0.06 -0.13,-0.06 -0.17,0ZM11.97,10.54l-1.38,-0.92s-0.05,-0.08 -0.03,-0.13l1.38,-2.4c0.04,-0.06 0.13,-0.06 0.17,0l1.39,2.4s0.01,0.1 -0.03,0.13l-1.39,0.92s-0.07,0.02 -0.11,0ZM15.76,10.76l-3.28,2.2s-0.04,0.05 -0.04,0.08v4.19c0,0.05 0.04,0.1 0.1,0.1h6.97c0.07,0 0.12,-0.08 0.08,-0.14l-3.7,-6.39s-0.09,-0.06 -0.14,-0.03ZM13.8,13.59l1.37,-0.92s0.11,-0.02 0.14,0.03l1.77,3.07c0.04,0.06 0,0.14 -0.08,0.14h-3.14c-0.05,0 -0.1,-0.05 -0.1,-0.1v-2.15s0.02,-0.06 0.04,-0.08ZM11.6,13.04v4.19c0,0.05 -0.04,0.1 -0.1,0.1h-1.16c-0.05,0 -0.1,-0.04 -0.1,-0.1v-2.04c0,-0.05 -0.04,-0.1 -0.1,-0.1H5.81c-0.07,0 -0.12,-0.08 -0.08,-0.14l0.55,-0.95s0.05,-0.05 0.08,-0.05h3.78c0.05,0 0.1,-0.04 0.1,-0.1v-0.19s-0.02,-0.06 -0.04,-0.08l-1.42,-0.92s-0.1,-0.02 -0.13,0.03l-0.14,0.22s-0.05,0.04 -0.08,0.04H7.05c-0.07,0 -0.12,-0.08 -0.08,-0.14l1.17,-2.03s0.09,-0.06 0.14,-0.03l3.28,2.2s0.04,0.05 0.04,0.08Z'

          def icon_vector(width, color, safe):
              group_open = '<group android:scaleX="0.68" android:scaleY="0.68" android:pivotX="12" android:pivotY="12">' if safe else '<group>'
              return f'''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="{width}" android:height="{width}" android:viewportWidth="24" android:viewportHeight="24">\n    {group_open}\n        <path android:fillColor="@android:color/transparent" android:strokeColor="{color}"\n            android:strokeWidth="1.5" android:strokeLineJoin="round" android:pathData="{outer_path}" />\n        <path android:fillColor="{color}" android:pathData="{glyph_path}" />\n    </group>\n</vector>\n'''

          # Launcher foregrounds use the same +0.5 outlined geometry in the adaptive safe zone.
          Path('app-mobile/src/main/res/drawable/ic_launcher_foreground.xml').write_text(icon_vector('108dp', '#FF6DE892', True))
          Path('app-mobile/src/main/res/drawable/ic_launcher_monochrome.xml').write_text(icon_vector('108dp', '#FFFFFFFF', True))
          Path('app-wear/src/main/res/drawable/ic_launcher_foreground.xml').write_text(icon_vector('108dp', '#FF6DE892', True))
          Path('app-wear/src/main/res/drawable/ic_launcher_monochrome.xml').write_text(icon_vector('108dp', '#FFFFFFFF', True))
          Path('app-wear/src/main/res/drawable/ic_monochrome_outlined.xml').write_text(icon_vector('24dp', '#FF6DE892', False))

          # Ensure no diagnostic artifacts are carried into the final tree.
          for temp in [
              '.github/workflows/diagnose-build-v6.yml',
              'ci-diagnostic-v6.txt',
              'tools/.v6-build-trigger',
          ]:
              p = Path(temp)
              if p.exists():
                  p.unlink()
          PY
          git diff --check
          git status --short
      - name: Test affected modules
        run: >-
          ./gradlew
          :core-model:test
          :complications:testDebugUnitTest
          :app-mobile:testDebugUnitTest
          :app-mobile:assembleDebug
          :app-wear:testDebugUnitTest
          :app-wear:assembleDebug
      - name: Commit audited polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish audited mobile and Wear presentation refactor"
          git push origin HEAD:agent/complication-watch-refactor-v6
      - name: Remove temporary polish workflow
        run: |
          rm -f .github/workflows/final-v6-polish.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary final polish workflow"
          git push origin HEAD:agent/complication-watch-refactor-v6
