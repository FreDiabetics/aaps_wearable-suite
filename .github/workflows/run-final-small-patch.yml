name: Run final deterministic source patch
on:
  push:
    branches:
      - agent/complication-watch-refactor-final
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/final_small_patch.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-mobile/src/main/kotlin/app/aapswear/mobile/DashboardViews.kt app-mobile/src/main/kotlin/app/aapswear/mobile/OverviewWatchFaceTile.kt app-wear/src/main/res/layout/activity_wear.xml
          git commit -m "Persist settings state and align preview geometry"
          rm -f tools/final_small_patch.py .github/workflows/run-final-small-patch.yml
          git add -A
          git commit -m "Remove temporary final patch helper"
          git push origin HEAD:agent/complication-watch-refactor-final
