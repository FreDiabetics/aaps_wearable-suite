name: diagnose build v6

on:
  push:
    branches:
      - agent/complication-watch-refactor-v6

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !startsWith(github.event.head_commit.message, 'CI diagnostic:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run affected module tests and builds
        shell: bash
        run: |
          set +e
          ./gradlew \
            :core-model:test \
            :complications:testDebugUnitTest \
            :app-mobile:testDebugUnitTest \
            :app-mobile:assembleDebug \
            :app-wear:testDebugUnitTest \
            :app-wear:assembleDebug \
            --console=plain --stacktrace > /tmp/build.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo "head=$(git rev-parse HEAD)"
            echo "scope=affected-modules"
            echo "--- compiler/test/error lines ---"
            grep -E -i '(^e: |error:|FAILURE:|FAILED|Execution failed|What went wrong|Compilation error|Unresolved reference|Type mismatch|Cannot access|No value passed|expected.*but|There were failing tests|Caused by:)' /tmp/build.log | tail -n 220 || true
            echo "--- tail ---"
            tail -n 160 /tmp/build.log
          } > ci-diagnostic-v6.txt
          if [ "$status" -eq 0 ]; then
            echo "BUILD_OK" >> ci-diagnostic-v6.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostic-v6.txt
          git commit -m "CI diagnostic: capture v6 build result" || true
          git push origin HEAD:agent/complication-watch-refactor-v6
          exit 0
