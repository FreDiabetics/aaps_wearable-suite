name: Promote complication watch source

on:
  push:
    branches:
      - agent/complication-watch-menu-pass

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/complication-watch-final agent/complication-watch-menu-pass
          git checkout -B agent/complication-watch-final origin/agent/complication-watch-final
          git checkout origin/agent/complication-watch-menu-pass -- \
            app-mobile/src/main/kotlin/app/aapswear/mobile/ComplicationCatalog.kt \
            app-wear/src/main/AndroidManifest.xml \
            app-wear/src/main/kotlin/app/aapswear/wear/StateDataLayerService.kt \
            app-wear/src/main/res/layout/activity_wear.xml \
            complications/src/main/kotlin/app/aapswear/complications/TherapyComplications.kt \
            complications/src/test/kotlin/app/aapswear/complications/TherapyComplicationsTest.kt \
            watchfaces/sugarlicious-analog/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-analog/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-orbit/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-orbit/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-rings/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-rings/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-graph/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-graph/src/main/res/values/strings.xml
          git add \
            app-mobile/src/main/kotlin/app/aapswear/mobile/ComplicationCatalog.kt \
            app-wear/src/main/AndroidManifest.xml \
            app-wear/src/main/kotlin/app/aapswear/wear/StateDataLayerService.kt \
            app-wear/src/main/res/layout/activity_wear.xml \
            complications/src/main/kotlin/app/aapswear/complications/TherapyComplications.kt \
            complications/src/test/kotlin/app/aapswear/complications/TherapyComplicationsTest.kt \
            watchfaces/sugarlicious-analog/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-analog/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-orbit/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-orbit/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-rings/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-rings/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-graph/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-graph/src/main/res/values/strings.xml
          git diff --cached --check
          git commit -m "Restructure complications and watch customization"
          git push origin HEAD:agent/complication-watch-final
