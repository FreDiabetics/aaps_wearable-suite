name: Integrate complication and watch customization

on:
  push:
    branches:
      - agent/complication-watch-menu-pass

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply complication core changes
        run: python tools/complication-pass.py

      - name: Apply complication constants
        run: python tools/complication-constants-fix.py

      - name: Apply provider manifest changes
        run: python tools/complication-manifest-fix.py

      - name: Apply mobile and watchface UI changes
        run: python tools/ui-watchface-pass.py

      - name: Update regression tests
        run: python tools/complication-tests-fix.py

      - name: Verify diff
        run: git diff --check

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Test and build affected applications
        run: >-
          ./gradlew
          :complications:testDebugUnitTest
          :app-mobile:testDebugUnitTest
          :app-mobile:assembleDebug
          :app-wear:testDebugUnitTest
          :app-wear:assembleDebug
          :watchfaces:sugarlicious-analog:assembleDebug
          :watchfaces:sugarlicious-orbit:assembleDebug
          :watchfaces:sugarlicious-rings:assembleDebug
          :watchfaces:sugarlicious-graph:assembleDebug

      - name: Validate Watch Face Format XML
        shell: pwsh
        run: ./tools/wff-validator/validate.ps1

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            complications/src/main/kotlin/app/aapswear/complications/TherapyComplications.kt \
            complications/src/test/kotlin/app/aapswear/complications/TherapyComplicationsTest.kt \
            app-mobile/src/main/kotlin/app/aapswear/mobile/ComplicationCatalog.kt \
            app-wear/src/main/AndroidManifest.xml \
            app-wear/src/main/kotlin/app/aapswear/wear/StateDataLayerService.kt \
            app-wear/src/main/res/layout/activity_wear.xml \
            watchfaces/sugarlicious-analog/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-analog/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-orbit/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-orbit/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-rings/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-rings/src/main/res/values/strings.xml \
            watchfaces/sugarlicious-graph/src/main/res/raw/watchface.xml \
            watchfaces/sugarlicious-graph/src/main/res/values/strings.xml
          if ! git diff --cached --quiet; then
            git commit -m "Restructure complications and watch customization"
            git push
          fi
